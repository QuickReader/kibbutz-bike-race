// two-bone IK in the (z,y) plane of the parent; elbow/knee bend direction `bend` (+1 forward/up)

/* ---------- bike (front = +z) ---------- */

  add(t, solid(G.cyl(0.18, 0.8, 8), 0x8A6240, { y: 0.4 }), solid(G.sphere(1, 16, 14), 0x2F7A45, { y: 3.4, sx: 0.85, sy: 3.1, sz: 0.85 }), solid(G.sphere(0.7, 12, 10), 0x3E9457, { x: 0.15, y: 2.4, z: 0.5, sy: 1.8, outline: false }));
  return t;
}
function tower() {
  const t = grp();
  for (const x of [-1, 1]) for (const z of [-1, 1]) { const l = tube(new THREE.Vector3(x * 2, 0, z * 2), new THREE.Vector3(x * 1.4, 11, z * 1.4), 0.2, 0xBDB8AE); add(t, l); }
  add(t, solid(G.cyl(2.4, 3.2, 18), 0xF0EADB, { y: 12.6 }), solid(new THREE.ConeGeometry(2.6, 1.6, 18), 0xD04A32, { y: 15 }), solid(G.cyl(2.45, 0.35, 18), 0x2E6F8E, { y: 12.8, outline: false }));
  return t;
}
function cloud(s) {
  const c = grp(); c.scale.setScalar(s);
  for (const [x, y, r] of [[0, 0, 4], [4.2, -0.6, 3], [-4, -0.7, 2.8], [2, 1.8, 3]]) add(c, solid(G.sphere(r, 14, 10), 0xFFFFFF, { x, y, sz: 0.6 }));
  return c;
}

/* ---------- scene ---------- */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(FOG, FOG_NEAR, FOG_FAR);
const cam = new THREE.PerspectiveCamera(62, 16 / 9, 0.3, 220);
const sun = new THREE.DirectionalLight(0xFFF1D6, 2.2); sun.position.set(-30, 50, 20);
scene.add(sun, new THREE.HemisphereLight(0xCFEFFF, 0xBFD98A, 1.9));

// sky dome, hills, clouds
const sg = new THREE.SphereGeometry(200, 16, 10), sc = [];
for (let i = 0; i < sg.attributes.position.count; i++) { const c = new THREE.Color(0xCDEBFA).lerp(new THREE.Color(0x3FA9F0), Math.pow(Math.max(0, Math.min(1, sg.attributes.position.getY(i) / 120)), 0.8)); sc.push(c.r, c.g, c.b); }
sg.setAttribute('color', new THREE.Float32BufferAttribute(sc, 3));
const sky = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })); sky.renderOrder = -1; scene.add(sky);
scene.add(solid(G.sphere(1, 24, 12), 0xA7C98B, { x: -60, y: -6, z: 150, sx: 70, sy: 22, sz: 30, outline: false }), solid(G.sphere(1, 24, 12), 0x9CC283, { x: 50, y: -8, z: 160, sx: 80, sy: 26, sz: 30, outline: false }));
const cl = cloud(1.3); cl.position.set(-30, 40, 120); const cl2 = cloud(1); cl2.position.set(40, 48, 140); const cl3 = cloud(0.8); cl3.position.set(8, 34, 130); scene.add(cl, cl2, cl3);

// ground: instanced 8 m squares in two greens
const cellG = new THREE.PlaneGeometry(8, 8).rotateX(-Math.PI / 2), nx = 16, nz = 28;
const ground = new THREE.InstancedMesh(cellG, new THREE.MeshToonMaterial({ gradientMap: grad }), nx * nz), mm = new THREE.Matrix4();
for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) { const k = i * nz + j; ground.setMatrixAt(k, mm.makeTranslation(-64 + i * 8 + 4, 0, -24 + j * 8 + 4)); ground.setColorAt(k, new THREE.Color((i + j) & 1 ? 0x8ED043 : 0x7CC338)); }
scene.add(ground);

// path: curved ribbon with cream kerb and ink edge
const bendX = z => 0.0016 * z * z;
function ribbon(half, y, color) {
  const v = [], idx = [], N = 60;
  for (let i = 0; i <= N; i++) { const z = -25 + i * 3.5, x = bendX(z); v.push(x - half, y, z, x + half, y, z); if (i < N) idx.push(i * 2, i * 2 + 2, i * 2 + 1, i * 2 + 1, i * 2 + 2, i * 2 + 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, toon(color));
}
scene.add(ribbon(2.55, 0.02, 0x2A2233), ribbon(2.4, 0.03, 0xF4EEDF), ribbon(2.0, 0.045, 0xCFC6B4));
// dashed centre line
for (let z = -20; z < 150; z += 4) { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 1.6).rotateX(-Math.PI / 2), toon(0xF4EEDF)); m.position.set(bendX(z), 0.055, z); m.rotation.y = -Math.atan(0.0032 * z); scene.add(m); }
// flowers and tufts
const fl = new THREE.InstancedMesh(new THREE.SphereGeometry(0.12, 6, 5), new THREE.MeshToonMaterial({ gradientMap: grad }), 160);
for (let i = 0; i < 160; i++) { const z = -8 + (i * 29.3) % 120, side = i & 1 ? 1 : -1, x = bendX(z) + side * (3.4 + (i * 7.7) % 18); fl.setMatrixAt(i, mm.makeTranslation(x, 0.12, z)); fl.setColorAt(i, new THREE.Color([0xFFFFFF, 0xFFD23F, 0xFF8FB1][i % 3])); }
scene.add(fl);

// props
const H1 = house(0xFFF1D6, 0xD2573A); H1.position.set(bendX(16) + 8.5, 0, 16); H1.rotation.y = -Math.PI / 2 - 0.1; scene.add(H1);
const H2 = house(0xFBE7B8, 0xC24A32, 0x2E8FA3); H2.position.set(bendX(42) - 9.5, 0, 42); H2.rotation.y = Math.PI / 2 + 0.1; scene.add(H2);
const H3 = house(0xE9F1D8, 0x3F7DB8, 0xD2573A); H3.position.set(bendX(30) + 12, 0, 62); H3.rotation.y = -Math.PI / 2; scene.add(H3);
for (const [x, z, k, s] of [[-9.5, 9, 'e', 0.9], [-9, 20, 'c', 1.2], [-6, 30, 'e', 1.1], [7, -2, 'c', 1], [5.5, 36, 'e', 1], [-14, 2, 'e', 1.2], [11, 7, 'c', 0.9], [4.8, 52, 'c', 1.1]]) { const t = k === 'e' ? eucalyptus(s) : cypress(s); t.position.set(bendX(z) + x, 0, z); t.rotation.y = x * 3; scene.add(t); }
const T = tower(); T.position.set(-28, 0, 85); scene.add(T);

// characters
const player = person({ skin: 0xF1C9A0, shirt: 0xFFD23F, pants: 0x34406B, shoe: 0xFFFFFF, hair: 0x3A2A1A, helmet: 0xFFFFFF, stripe: 0xFF3D2E });
const pBike = bike(0xFF3D2E, true), P = grp(0, 0, 0); add(P, pBike, player.root); rider(player, pBike, 0.9); scene.add(P);
const ai = person({ skin: 0xC68E5E, shirt: 0x2D6CDF, pants: 0x34406B, hair: 0x1E1A16, style: 'curly', stripe: 0xFFFFFF, helmet: 0 });
const aBike = bike(0x2D6CDF, false), A = grp(-0.7, 0, 9.5); add(A, aBike, ai.root); rider(ai, aBike, 2.4, 0.5); A.rotation.y = 0.04; scene.add(A);
const w1 = person({ skin: 0x8D5A3B, shirt: 0xD96C8E, pants: 0x4A4F63, hair: 0x1E1A16, style: 'bun', shoe: 0x3A3340 });
const W1 = grp(bendX(6) + 1.3, 0, 6.6); add(W1, w1.root); W1.rotation.y = Math.PI + 0.35; scene.add(W1);
const w2 = person({ skin: 0xF1C9A0, shirt: 0x5AA0D8, pants: 0x6B5B45, hair: 0x8A5A2B, style: 'pony', shorts: true, shoe: 0x3A3340 });
const W2 = grp(bendX(14) - 1.5, 0, 14); add(W2, w2.root); W2.rotation.y = 0.15; scene.add(W2);
const w3 = person({ skin: 0xC68E5E, shirt: 0x9AA0A6, pants: 0x4A4F63, hair: 0xB8B2A8, style: 'cap', shoe: 0xFFFFFF });
const W3 = grp(bendX(24) + 2.9, 0, 24); add(W3, w3.root); W3.rotation.y = Math.PI - 0.3; scene.add(W3);
walk(w1, 0.8); walk(w2, 2.2); walk(w3, 4.1);
for (const [o, w, l] of [[P, 0.5, 1.0], [A, 0.5, 0.95], [W1, 0.55, 0.55], [W2, 0.55, 0.55], [W3, 0.55, 0.55]]) { const b = blob(w, l); o.add(b); }

// camera
function setCam() { cam.position.set(0.35, 2.4, -4.7); cam.lookAt(0.0, 1.0, 6); }
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); setCam();
const t0 = performance.now();
function frame() {
  const t = (performance.now() - t0) / 1000;
  rider(player, pBike, 0.9 + t * 4); rider(ai, aBike, 2.4 + t * 4, 0.5);
  pBike.userData.wheels.forEach(w => w.children[0].rotation.x = t * 8);
  walk(w1, 0.8 + t * 5); walk(w2, 2.2 + t * 5); walk(w3, 4.1 + t * 5);
  sky.position.copy(cam.position);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
frame();
</script>
